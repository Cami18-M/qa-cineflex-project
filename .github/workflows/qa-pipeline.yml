name: QA Pipeline CineFlex

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Permisos minimos: solo lectura del contenido del repositorio
permissions:
  contents: read

jobs:
  api-tests:
    name: Pruebas de API (Newman)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm install

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar backend y correr las pruebas de API
        env:
          PORT: 3000
          JWT_SECRET: cineflex_secreto_ci
          LOGIN_MAX_INTENTOS: 3
          LOGIN_BLOQUEO_SEG: 60
        run: |
          cd backend
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          cd ..

          # Espera activa hasta que el backend este disponible (max 30 s)
          echo "Esperando a que el backend este disponible..."
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "El backend no inicio a tiempo."
            cat backend/server.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Backend disponible en http://localhost:3000"

          # Ejecucion de la coleccion Postman con Newman
          newman run api_tests/CineFlex_API_Collection.json \
            -e api_tests/CineFlex_Environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml
          NEWMAN_EXIT=$?

          kill "$SERVER_PID" 2>/dev/null || true
          exit $NEWMAN_EXIT

      - name: Subir reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.xml
          if-no-files-found: warn
